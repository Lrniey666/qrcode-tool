# cargo-deny configuration (run in CI): license allow-list, banned and unknown sources.
[graph]
targets = ["x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc", "aarch64-apple-darwin", "x86_64-unknown-linux-gnu"]
all-features = false

[licenses]
allow = [
  "Apache-2.0", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "0BSD", "BSL-1.0",
  "Unicode-3.0", "Unlicense", "CC0-1.0", "MPL-2.0", "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

# Slint is used under its royalty-free desktop license (attribution in Settings › About).
[[licenses.exceptions]]
allow = ["LicenseRef-Slint-Royalty-free-2.0", "GPL-3.0-only", "LicenseRef-Slint-Software-3.0"]
crate = "i-slint-backend-selector"

[[licenses.exceptions]]
allow = ["LicenseRef-Slint-Royalty-free-2.0", "GPL-3.0-only", "LicenseRef-Slint-Software-3.0"]
crate = "i-slint-backend-testing"

