name: Translation
description: Report or fix a translation problem
labels: [translation]
body:
  - type: input
    id: language
    attributes:
      label: Language
      placeholder: "zh-TW"
    validations:
      required: true
  - type: textarea
    id: text
    attributes:
      label: Current text, suggested text and where it appears
    validations:
      required: true
